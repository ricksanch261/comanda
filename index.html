  <script>
    // Applica subito il tema salvato per evitare il lampeggio.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('gestione-tavoli:prefs') || '{}');
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <script type="module" src="js/main.js"></script>

<body>
  <div id="app"><div class="boot">Caricamento…</div></div>
  <noscript>Per usare Gestione Tavoli è necessario abilitare JavaScript.</noscript>
</body>
